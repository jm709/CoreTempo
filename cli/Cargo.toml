[package]
name = "coretempo-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[[bin]]
name = "tempo"
path = "src/main.rs"

[dependencies]
coretempo-core = { path = "../core", default-features = false }
anyhow = "=1.0.104"
clap = { version = "=4.6.5", features = ["derive"] }
libc = { workspace = true }
serde = "=1.0.229"
serde_json = "=1.0.151"
toml = "=1.1.4"
ureq = { version = "=3.3.0", default-features = false, features = ["json"] }

# Workspace lint table copied, not inherited: a CLI's job is printing, so the two
# print lints flip to allow. Everything else must stay in lockstep with the workspace.
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "warn"
panic = "deny"
panic_in_result_fn = "deny"
unimplemented = "deny"
allow_attributes = "deny"
dbg_macro = "deny"
todo = "deny"
print_stdout = "allow"
print_stderr = "allow"
await_holding_lock = "deny"
large_futures = "deny"
exit = "deny"
mem_forget = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
