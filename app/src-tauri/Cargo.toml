[package]
name = "coretempo-app"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "coretempo"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
coretempo-core = { path = "../../core" }
tauri = { version = "2.11.5", features = [] }
tauri-plugin-dialog = "2.7.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
anyhow = "1.0.104"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
tokio = { version = "1.53.1", features = ["sync", "fs", "macros", "rt"] }
toml_edit = "0.25.13"

[dev-dependencies]
tauri = { version = "2.11.5", features = ["test"] }
tokio = { version = "1.53.1", features = ["macros", "rt-multi-thread", "sync", "time"] }

[lints]
workspace = true
