name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Tauri system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
      # coretempo-app declares coretempod as a Tauri externalBin, and tauri-build
      # fails its build script when binaries/coretempod-<triple> is missing — so
      # the workspace-wide clippy and test runs below need it staged first.
      - name: Stage the coretempod sidecar
        run: |
          cargo build -p coretempo-daemon
          app/src-tauri/scripts/prepare-sidecar.sh debug
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace

  web:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
        with:
          version: 10.32.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: |
            app/pnpm-lock.yaml
            clients/js/pnpm-lock.yaml
      - name: Install webview dependencies
        run: pnpm install --frozen-lockfile
        working-directory: app
      - name: svelte-check
        run: pnpm exec svelte-check --threshold error
        working-directory: app
      - name: Lint webview
        run: pnpm exec oxlint src
        working-directory: app
      - name: Test webview
        run: pnpm exec vitest run
        working-directory: app
      - name: Install client dependencies
        run: pnpm install --frozen-lockfile
        working-directory: clients/js
      - name: Typecheck client
        run: pnpm exec tsc --noEmit
        working-directory: clients/js
      - name: Lint client
        run: pnpm exec oxlint src
        working-directory: clients/js
      - name: Test client
        run: pnpm exec vitest run
        working-directory: clients/js
