[package]
name = "coretempo-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[features]
default = ["server"]
server = [
    "dep:tokio",
    "dep:portable-pty",
    "dep:libc",
    "dep:tracing",
    "dep:rand",
    "dep:rusqlite",
    "dep:toml",
    "dep:sha2",
    "dep:axum",
    "dep:tokio-stream",
    "dep:subtle",
    "dep:jsonschema",
]

[dependencies]
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "net", "fs"], optional = true }
portable-pty = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }
rand = { workspace = true, optional = true }
rusqlite = { version = "=0.40.1", features = ["bundled"], optional = true }
toml = { version = "=1.1.4", optional = true }
sha2 = { version = "=0.10.9", optional = true }
axum = { version = "=0.8.9", optional = true }
tokio-stream = { version = "=0.1.19", optional = true }
subtle = { version = "=2.6.1", optional = true }
jsonschema = { version = "=0.49.6", default-features = false, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "sync", "time", "macros", "test-util", "io-util"] }
rusqlite = { version = "=0.40.1", features = ["bundled"] }
toml = "=1.1.4"
anyhow = "=1.0.104"
ureq = { version = "=3.3.0", default-features = false, features = ["json"] }
tempfile = "=3.27.0"

[lints]
workspace = true
